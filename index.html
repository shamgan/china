<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טיול למרכז סין | רמת טיבט</title>
<meta name="description" content="גלריית תמונות נבחרות מהטיול לרמת טיבט ומרכז סין - מפות, גיאוגרפיה אנושית וגיאוגרפיה פיסית.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<div class="journey-progress" id="journey-progress" aria-hidden="true"><span id="journey-progress-fill"></span></div>

<header class="hero">
  <div class="hero-sky" aria-hidden="true"></div>
  <div class="hero-mountains" aria-hidden="true">
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
      <path class="mtn-back" d="M0,180 L120,90 L240,150 L380,60 L520,140 L660,40 L820,130 L960,70 L1100,150 L1260,90 L1440,160 L1440,220 L0,220 Z"></path>
      <path class="mtn-front" d="M0,220 L100,140 L220,190 L340,110 L470,180 L600,100 L760,190 L900,120 L1040,200 L1180,130 L1320,200 L1440,150 L1440,220 L0,220 Z"></path>
    </svg>
  </div>
  <div class="hero-inner">
    <p class="hero-eyebrow">&#10022; אלבום טיול &#10022;</p>
    <h1>טיול למרכז סין</h1>
    <p class="hero-subtitle">רמת טיבט &middot; דרך המשי &middot; מדבר גובי</p>
    <nav class="route-nav" aria-label="ניווט בין קטגוריות">
      <a href="#maps" class="route-stop"><span class="route-dot">1</span><span class="route-label">מפות</span></a>
      <a href="#human" class="route-stop"><span class="route-dot">2</span><span class="route-label">גיאוגרפיה אנושית</span></a>
      <a href="#physical" class="route-stop"><span class="route-dot">3</span><span class="route-label">גיאוגרפיה פיסית</span></a>
    </nav>
  </div>
</header>

<main id="gallery-root">
  <!-- הקטגוריות נבנות אוטומטית ע"י script.js מתוך data.json -->
  <p class="loading">טוען תמונות...</p>
</main>

<footer class="site-footer">
  <p>אלבום דיגיטלי מהטיול לסין ולרמת טיבט</p>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="סגירה">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="התמונה הקודמת">&#8250;</button>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="התמונה הבאה">&#8249;</button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption">
      <p id="lightbox-caption-text"></p>
      <button class="location-btn lightbox-location-btn" id="lightbox-location-btn" type="button" hidden>
        <span aria-hidden="true">📍</span> מיקום הצילום
      </button>
      <p class="lightbox-counter" id="lightbox-counter"></p>
    </div>
  </div>
</div>

<div class="location-modal" id="location-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="location-modal-panel">
    <button class="location-modal-close" id="location-modal-close" aria-label="סגירה">&times;</button>
    <h3 id="location-site-name"></h3>
    <p id="location-description"></p>
    <p class="location-approx-note" id="location-approx-note" hidden>* מיקום משוער, מבוסס על תמונה סמוכה שצולמה עם GPS</p>
    <div id="location-map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Clean up any leftover service worker from the previous app at this address.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((reg) => reg.unregister());
    });
    if (window.caches) {
      caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
    }
  }
</script>
<script src="script.js"></script>
</body>
</html>
